name: Setup
description: >-
  Installs Nix and caches ~/.cargo and target/ for the dev shell's Rust toolchain. Only master
  saves the cache: one saved on a pull request ref can't be read from any other.
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
    # rust-cache keys on `rustc -vV`, so put the dev shell's toolchain first on PATH.
    - shell: bash
      run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
