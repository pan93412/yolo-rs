name: Benchmark

# Weekly, by hand, and on pull requests that change the benchmark: times preprocessing and inference (NMS included) on the CPU for YOLO11x,
# fixed so that runs compare, and for the newest YOLO family in ultralytics/assets. Shared runners
# vary by a few percent from run to run, so read trends rather than single differences.
on:
  schedule:
    # Monday 03:00 Asia/Taipei
    - cron: "0 19 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - benches/**
      - .github/workflows/benchmark.yml

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Download YOLO11x
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL -o "$RUNNER_TEMP/models/yolo11x.onnx" \
            https://huggingface.co/pan93412/yolo-v11-onnx/resolve/a2b3cf2eb0795b6997ef8e16846fee4babddcb06/yolo11x.onnx
          echo "c3d0431659993c018741a085af1ba4a399f9a92a0c013a037510552b935b43c2  $RUNNER_TEMP/models/yolo11x.onnx" | sha256sum -c

      # yolo-rs reads the one-to-many output ([1, 84, 8400]); end2end=False exports it (#90).
      - name: Export the newest YOLO
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R ultralytics/assets --json tagName --jq .tagName)
          family=$(gh release view -R ultralytics/assets "$tag" --json assets \
            --jq '[.assets[].name | capture("^yolo(?<n>[0-9]+)x\\.pt$") | .n | tonumber] | max')
          model="yolo${family}x"
          gh release download -R ultralytics/assets "$tag" -p "$model.pt" -D "$RUNNER_TEMP/models"
          (cd "$RUNNER_TEMP/models" && nix develop "$GITHUB_WORKSPACE#export" -c yolo export model="$model.pt" format=onnx end2end=False)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Benchmark
        env:
          NEWEST: ${{ steps.newest.outputs.model }}
        run: |
          export YOLO_BENCH_MODELS="$RUNNER_TEMP/models/yolo11x.onnx,$RUNNER_TEMP/models/$NEWEST.onnx"
          nix develop -c cargo bench --locked --bench inference

      - name: Summary
        env:
          TAG: ${{ steps.newest.outputs.tag }}
          NEWEST: ${{ steps.newest.outputs.model }}
        run: |
          {
            echo "$(nproc) × $(lscpu | sed -n 's/^Model name: *//p' | head -1), ONNX Runtime on the CPU, \`examples/yolo-cli/data/baseball.jpg\`."
            echo "The newest family is $NEWEST from ultralytics/assets $TAG, exported with \`end2end=False\`."
            echo
            echo "| Benchmark | Mean | 95% CI of the mean | Median |"
            echo "| --- | ---: | ---: | ---: |"
            find target/criterion -path '*/new/benchmark.json' | sort | while read -r benchmark; do
              jq -rn --slurpfile b "$benchmark" --slurpfile e "$(dirname "$benchmark")/estimates.json" '
                def ms: . / 1e6 * 1000 | round / 1000 | tostring + " ms";
                $e[0] as $e
                | "| \($b[0].full_id) | \($e.mean.point_estimate | ms) | \($e.mean.confidence_interval.lower_bound | ms) – \($e.mean.confidence_interval.upper_bound | ms) | \($e.median.point_estimate | ms) |"'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: target/criterion
          retention-days: 90
