# Clippy configuration. Lint levels live in Cargo.toml [workspace.lints].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Proper nouns that doc_markdown would otherwise ask to wrap in backticks.
doc-valid-idents = ["IoU", "ONNX", "YOLOv8", "YOLOv8x", "YOLO11x", "YOLO12x", "YOLO26x", "YOLOv11", "CoreML", "CUDA", ".."]
